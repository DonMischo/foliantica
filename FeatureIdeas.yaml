features:

  - id: coworking
    name: Co-Working
    status: planned
    description: >
      Let multiple people work on the same Foliantica project simultaneously.
      One person runs the app as host; guests join via browser over LAN or the
      internet (UPnP / manual port-forward). Real-time updates via WebSocket.
      Presence awareness and per-chapter edit locking prevent conflicts.
      No cloud services, no VPN required.

    out_of_scope:
      - VPN key generation / WireGuard integration (users handle VPN themselves)
      - Cloud / async handoff (sync.py already covers the mirror use-case)
      - Authentication (LAN/trusted-network assumption)
      - CRDT / operational transform (soft locks are sufficient)
      - Cloudflare Tunnel or any external relay service

    phases:

      - id: 1
        name: Network Foundation
        goal: Guests can open the app in a browser and use it over LAN or internet.
        steps:
          - Add `cowork_enabled: bool` to UserSettings model + migration.
          - Add `cowork_host: str` to UserSettings (stores chosen bind-interface IP or "0.0.0.0").
          - "electron/main.js: on startup read cowork_enabled from ~/.foliantica/config.json.
            If true, bind API and Next.js standalone server to 0.0.0.0 instead of 127.0.0.1."
          - "api/main.py: when cowork_enabled, change CORS allow_origin_regex to allow any
            origin (allow_origins=['*'])."
          - "api/routers/settings.py: expose cowork_enabled in GET/PATCH /api/settings."
          - "Settings UI: add 'Co-Work Mode' section with:
              - Toggle (requires restart note)
              - Detected LAN IP display (GET /api/collab/info)
              - Copyable URL: http://<lan-ip>:3000
              - UPnP sub-section (see internet_access below)"

        internet_access:
          upnp:
            description: >
              Automatically punch a hole through the router using UPnP/NAT-PMP.
              No router UI needed. Works on most home/office networks.
            dep: miniupnpc   # pip install miniupnpc
            flow:
              - "POST /api/collab/upnp/enable: call miniupnpc.UPnP(), discover(),
                 addportmapping(external_port, 'TCP', internal_port, description)."
              - Return external_ip + external_port to frontend.
              - Display public URL: http://<external-ip>:<external-port>
              - "POST /api/collab/upnp/disable: deleteportmapping to clean up on stop."
              - Lease renewed every 10 min by a background thread (UPnP leases expire).
            fallback_note: >
              If UPnP is unavailable, show a collapsible 'Manual port forwarding' section
              with this text: "In your router admin panel (usually http://192.168.1.1),
              find 'Port Forwarding' or 'Virtual Server'. Forward external TCP port 8000
              to this machine's local IP on port 8000 (same for port 3000 if guests should
              access the web UI directly). Then share your public IP with your co-author —
              find it at https://ifconfig.me or shown above."

      - id: 2
        name: Real-Time Event Push
        goal: Any save on the host propagates to all connected guests within ~1 second.
        steps:
          - "New file api/routers/collab.py:
              - ConnectionManager class: tracks active WebSocket connections.
              - broadcast(message: dict) method iterates all connections.
              - GET /ws/collab WebSocket endpoint: accept → register → receive loop → unregister on disconnect."
          - "api/main.py: include collab router; import and wire the after_commit broadcast hook.
             Reuse the existing SQLAlchemy after_commit pattern from sync.py:
             on every commit, call collab.broadcast({event:'change', resource:<table>, project_id:<id>})."
          - "New file web/src/hooks/useCollabSocket.ts:
              - Connects to ws://<api-host>/ws/collab on mount.
              - On message: parse JSON, call queryClient.invalidateQueries([resource, project_id]).
              - Reconnects with exponential back-off on drop."
          - Mount useCollabSocket in the root layout so it is always active.
          - "UI: small pulsing dot in the nav bar labelled 'Live' when WS is connected,
             grey 'Offline' when not."

      - id: 3
        name: Presence
        goal: Users can see who is online and which section they are in.
        steps:
          - "On WS connect, client sends: {type:'join', name:'Alice', color:'#e56bae'}.
             Name and color stored in localStorage; first-time users get a name prompt."
          - "collab.py: maintain clients dict[ws → {id, name, color, section, item_id}].
             On join/leave/move, broadcast full presence list to all clients:
             {type:'presence', users:[{id, name, color, section, item_id}]}"
          - "Client → server move event: {type:'move', section:'chapters', item_id:42}
             sent whenever user navigates to a different page/item."
          - "New component web/src/components/PresenceBar.tsx:
              - Renders avatar chips (initials + user color) in the top nav.
              - Tooltip on hover: name + current section."
          - "Section-level dots: in chapter list, codex list, research grid — render a small
             coloured ring on any item another user is currently viewing."

      - id: 4
        name: Edit Locking
        goal: Prevent two users from overwriting the same chapter content simultaneously.
        steps:
          - "collab.py: in-memory lock table dict[item_key → {user_id, locked_at}].
             item_key = '<item_type>:<item_id>' e.g. 'chapter:42'.
             Locks auto-expire after 30 s without a heartbeat."
          - "WS messages:
              {type:'lock',   item_type, item_id}  → acquire lock, broadcast result
              {type:'unlock', item_type, item_id}  → release lock, broadcast
              {type:'heartbeat', item_type, item_id} → reset expiry timer"
          - "Frontend (chapter editor):
              - On editor focus: send lock request.
              - If lock denied (held by another user): render Tiptap read-only + banner
                'Alice is editing this chapter'.
              - While editing: send heartbeat every 20 s.
              - On blur / navigate away: send unlock."
          - Scope lock to chapter editor only; other content types (codex, research) use
            last-write-wins via React Query refetch.

    files:
      new:
        - api/routers/collab.py
        - web/src/hooks/useCollabSocket.ts
        - web/src/components/PresenceBar.tsx
      modified:
        - api/main.py          # include collab router, after_commit hook
        - api/models.py        # cowork_enabled, cowork_host on UserSettings
        - api/database.py      # migration for new columns
        - api/routers/settings.py  # expose cowork fields
        - electron/main.js     # conditional 0.0.0.0 bind
        - web/src/app/settings/page.tsx  # Co-Work settings section
        - web/src/app/layout.tsx (or root provider)  # mount useCollabSocket

    dependencies:
      python:
        - miniupnpc   # UPnP port mapping; fallback gracefully if unavailable
      npm: []         # none — native browser WebSocket, existing React Query

  - id: postgres-migration
    name: PostgreSQL Migration
    status: idea
    branch: feature/postgres
    description: >
      Replace the embedded SQLite database with a bundled PostgreSQL instance
      managed by Electron (same child-process pattern as the FastAPI sidecar).
      Primary motivation: true concurrent writes for co-working. SQLAlchemy
      abstracts the dialect, so models/routers/schemas are untouched.
      Do this on a dedicated branch — it is a major infrastructure change.

    prerequisite: coworking   # concurrent writes only matter once co-working exists

    out_of_scope:
      - External / hosted PostgreSQL (app stays fully local)
      - Docker (PostgreSQL runs as a direct child process)
      - Async SQLAlchemy (stay synchronous, psycopg2-binary)
      - User-visible schema changes (models stay identical)

    decision_point:
      note: >
        Before starting, verify that SQLite WAL mode + pool_size=5 is actually
        insufficient under real co-working load. If write contention is rare
        (saves every few seconds per user), WAL may be good enough indefinitely.
        Only migrate if contention proves real.

    phases:

      - id: 1
        name: PostgreSQL Process Management
        goal: Electron starts and stops a bundled PostgreSQL instance alongside the API.
        steps:
          - "Root package.json: add `embedded-postgres` to dependencies.
             This pulls in platform-specific PG binaries at npm install time
             (~25 MB per platform, offline-capable after first install)."
          - "electron/main.js: add startPostgres(dataDir) function:
               const pg = new EmbeddedPostgres({
                 databaseDir: path.join(dataDir, 'pgdata'),
                 user: 'foliantica', password: 'foliantica',
                 port: 5433,         // fixed; avoids clash with system PG on 5432
                 persistent: true,
               });
               await pg.initialise(); // runs initdb only on first launch (~3 s)
               await pg.start();      // ~1 s every launch
               await pg.createDatabase('foliantica').catch(() => {});"
          - Call startPostgres() before spawning apiProc in startServers().
          - "Pass to apiProc env: LW_PG_PORT, LW_PG_USER, LW_PG_PASS, LW_PG_DB,
             LW_PG_DUMP_PATH (path to pg_dump binary inside node_modules)."
          - "killServers(): add `await pgProc?.stop()`."
          - "Splash screen: show 'Preparing database…' on first run (initdb takes ~3 s).
             Detect first run by checking if pgdata/ exists before pg.initialise()."

      - id: 2
        name: FastAPI Database Switch
        goal: API connects to PostgreSQL; all existing functionality works unchanged.
        steps:
          - "pyproject.toml: replace sqlite deps with `psycopg2-binary`.
             Critical: use -binary variant — it bundles libpq so PyInstaller can
             package it without a system PostgreSQL install on the user's machine."
          - "api/database.py:
               PG_PORT = os.getenv('LW_PG_PORT', '5433')
               PG_USER = os.getenv('LW_PG_USER', 'foliantica')
               PG_PASS = os.getenv('LW_PG_PASS', 'foliantica')
               PG_DB   = os.getenv('LW_PG_DB',   'foliantica')
               DATABASE_URL = f'postgresql://{PG_USER}:{PG_PASS}@127.0.0.1:{PG_PORT}/{PG_DB}'
               engine = create_engine(DATABASE_URL)  # drop connect_args, check_same_thread"
          - Remove all PRAGMA calls from database.py (SQLite-only).
          - "Dev mode (LaunchFoliantica.bat): keep SQLite via env var flag LW_USE_SQLITE=1.
             database.py checks this flag and falls back to SQLite URL.
             Avoids requiring a running PostgreSQL during local development."

      - id: 3
        name: Data Migration (Existing Users)
        goal: Users upgrading from SQLite lose no data.
        steps:
          - "New script api/scripts/migrate_sqlite_to_pg.py:
               - Reads all tables from foliantica.db via SQLite SQLAlchemy engine.
               - Inserts into PostgreSQL via PostgreSQL SQLAlchemy engine.
               - Idempotent: skip tables that already have rows (re-runnable)."
          - "electron/main.js: after startPostgres(), before starting API:
               - If pgdata/ was just initialised (first run) AND foliantica.db exists:
                 spawn the migration script, wait for completion, log result."
          - Keep foliantica.db as a backup (rename to foliantica.db.bak, never delete).

      - id: 4
        name: Sync Redesign
        goal: sync.py mirrors PostgreSQL instead of SQLite.
        steps:
          - "api/routers/sync.py: replace sqlite3.backup() with pg_dump subprocess:
               subprocess.run([pg_dump_path, '-h', '127.0.0.1', '-p', PG_PORT,
                 '-U', PG_USER, '-d', PG_DB, '-f', str(mirror/'foliantica.sql')],
                 env={**os.environ, 'PGPASSWORD': PG_PASS}, check=True)"
          - Mirror file changes from foliantica.db → foliantica.sql (plain SQL, readable).
          - pg_dump_path comes from LW_PG_DUMP_PATH env var passed by Electron.
          - Restore instructions for users: psql -f foliantica.sql foliantica

    files:
      new:
        - api/scripts/migrate_sqlite_to_pg.py
      modified:
        - package.json              # add embedded-postgres dependency
        - electron/main.js          # startPostgres(), env vars, killServers
        - api/database.py           # connection string, remove PRAGMA
        - api/routers/sync.py       # pg_dump instead of sqlite3.backup
        - api/pyproject.toml        # psycopg2-binary replaces sqlite driver

    dependencies:
      npm:
        - embedded-postgres         # bundles platform PG binaries (~25 MB/platform)
      python:
        - psycopg2-binary           # bundles libpq — no system PG needed on user machine
