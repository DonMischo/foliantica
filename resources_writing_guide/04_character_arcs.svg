<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Arial, sans-serif">
  <!-- BG -->
  <rect width="800" height="480" fill="#0F1E2E" rx="12"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="bold" letter-spacing="1">THE FOUR CHARACTER ARC TYPES</text>
  <line x1="60" y1="50" x2="740" y2="50" stroke="#B8860B" stroke-width="2"/>
  <text x="400" y="68" text-anchor="middle" fill="#8AADCC" font-size="12">Every character journey maps to one of these — choose intentionally</text>

  <!-- Axes labels -->
  <text x="30" y="200" fill="#8AADCC" font-size="11" transform="rotate(-90 30 200)">CHARACTER STATE</text>
  <text x="400" y="460" fill="#8AADCC" font-size="11" text-anchor="middle">STORY PROGRESS ▶</text>

  <!-- Grid lines -->
  <line x1="70" y1="100" x2="70" y2="420" stroke="#1A3A5C" stroke-width="1"/>
  <line x1="70" y1="420" x2="740" y2="420" stroke="#1A3A5C" stroke-width="1"/>
  <line x1="70" y1="260" x2="740" y2="260" stroke="#1A3A5C" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="56" y="104" fill="#5A7A9C" font-size="10" text-anchor="end">HIGH</text>
  <text x="56" y="264" fill="#5A7A9C" font-size="10" text-anchor="end">MID</text>
  <text x="56" y="424" fill="#5A7A9C" font-size="10" text-anchor="end">LOW</text>

  <!-- Axis ticks -->
  <text x="70" y="438" fill="#5A7A9C" font-size="10" text-anchor="middle">START</text>
  <text x="405" y="438" fill="#5A7A9C" font-size="10" text-anchor="middle">MIDPOINT</text>
  <text x="740" y="438" fill="#5A7A9C" font-size="10" text-anchor="middle">END</text>

  <!-- Arc 1: Positive Arc (green) -->
  <path d="M 70 380 C 150 370 250 340 340 300 C 430 260 520 200 740 120" 
        stroke="#1E6B4A" stroke-width="3" fill="none"/>
  <circle cx="740" cy="120" r="6" fill="#1E6B4A"/>
  <rect x="540" y="100" width="180" height="50" fill="#0D2E1A" rx="6" stroke="#1E6B4A" stroke-width="1"/>
  <text x="630" y="122" text-anchor="middle" fill="#80E8A8" font-size="13" font-weight="bold">POSITIVE ARC</text>
  <text x="630" y="140" text-anchor="middle" fill="#88DDAA" font-size="10">Overcomes flaw → grows</text>

  <!-- Arc 2: Negative / Tragedy (red) -->
  <path d="M 70 200 C 160 190 260 210 360 240 C 460 270 580 320 740 400" 
        stroke="#C0392B" stroke-width="3" fill="none"/>
  <circle cx="740" cy="400" r="6" fill="#C0392B"/>
  <rect x="540" y="374" width="180" height="50" fill="#3A0D0D" rx="6" stroke="#C0392B" stroke-width="1"/>
  <text x="630" y="396" text-anchor="middle" fill="#FF8080" font-size="13" font-weight="bold">NEGATIVE ARC</text>
  <text x="630" y="414" text-anchor="middle" fill="#FFAAAA" font-size="10">Doubles down on flaw → falls</text>

  <!-- Arc 3: Flat Arc (gold) -->
  <path d="M 70 200 C 200 198 400 202 740 200" 
        stroke="#B8860B" stroke-width="3" fill="none" stroke-dasharray="10,4"/>
  <circle cx="740" cy="200" r="6" fill="#B8860B"/>
  <rect x="540" y="176" width="180" height="50" fill="#2E2000" rx="6" stroke="#B8860B" stroke-width="1"/>
  <text x="630" y="198" text-anchor="middle" fill="#FFDD80" font-size="13" font-weight="bold">FLAT ARC</text>
  <text x="630" y="216" text-anchor="middle" fill="#FFCC40" font-size="10">Already complete; world changes</text>

  <!-- Arc 4: Corruption (purple) -->
  <path d="M 70 140 C 200 138 300 155 400 200 C 500 248 620 320 740 390" 
        stroke="#8E44AD" stroke-width="3" fill="none"/>
  <circle cx="740" cy="390" r="6" fill="#8E44AD"/>
  <rect x="75" y="106" width="170" height="50" fill="#1E0A2E" rx="6" stroke="#8E44AD" stroke-width="1"/>
  <text x="160" y="128" text-anchor="middle" fill="#CC88FF" font-size="13" font-weight="bold">CORRUPTION ARC</text>
  <text x="160" y="146" text-anchor="middle" fill="#BB66FF" font-size="10">Begins noble → twisted</text>

  <!-- Start dots -->
  <circle cx="70" cy="380" r="5" fill="#1E6B4A"/>
  <circle cx="70" cy="200" r="5" fill="#C0392B"/>
  <circle cx="70" cy="200" r="5" fill="#B8860B"/>
  <circle cx="70" cy="140" r="5" fill="#8E44AD"/>

  <!-- Key insight box -->
  <rect x="60" y="80" width="240" height="34" fill="#1A2A3A" rx="6"/>
  <text x="180" y="100" text-anchor="middle" fill="#8AADCC" font-size="11">The lie believed at START</text>
  <text x="180" y="114" text-anchor="middle" fill="#8AADCC" font-size="11">determines the arc's direction</text>
</svg>
