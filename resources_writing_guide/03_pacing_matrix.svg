<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="speedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C0392B"/>
      <stop offset="50%" style="stop-color:#B8860B"/>
      <stop offset="100%" style="stop-color:#1E6B4A"/>
    </linearGradient>
  </defs>

  <!-- BG -->
  <rect width="760" height="500" fill="#0F1E2E" rx="12"/>

  <!-- Title -->
  <text x="380" y="38" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="bold" letter-spacing="1">PACING TECHNIQUES MATRIX</text>
  <line x1="60" y1="50" x2="700" y2="50" stroke="#B8860B" stroke-width="2"/>
  <text x="380" y="68" text-anchor="middle" fill="#8AADCC" font-size="12">Every technique controls speed — use them intentionally</text>

  <!-- Speed spectrum bar -->
  <rect x="60" y="82" width="640" height="18" fill="url(#speedGrad)" rx="9"/>
  <text x="60" y="78" fill="#C0392B" font-size="10" font-weight="bold">FAST ◀</text>
  <text x="670" y="78" fill="#1E6B4A" font-size="10" font-weight="bold">▶ SLOW</text>

  <!-- Column headers -->
  <rect x="60" y="110" width="200" height="28" fill="#1A3A5C" rx="4"/>
  <text x="160" y="129" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="bold">TECHNIQUE</text>

  <rect x="270" y="110" width="200" height="28" fill="#C0392B" rx="4"/>
  <text x="370" y="129" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="bold">SPEEDS UP</text>

  <rect x="480" y="110" width="240" height="28" fill="#1E6B4A" rx="4"/>
  <text x="600" y="129" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="bold">SLOWS DOWN</text>

  <!-- Rows -->
  <g font-size="12">
  <!-- 1 -->
  <rect x="60" y="142" width="660" height="38" fill="#1A2A3A" rx="3"/>
  <text x="70" y="156" fill="#E0E8F0" font-weight="bold">Sentence length</text>
  <text x="70" y="173" fill="#8AADCC" font-size="10.5">Structure of sentences</text>
  <text x="275" y="156" fill="#FF8888" font-style="italic">Short. Punchy. Fragments.</text>
  <text x="485" y="156" fill="#88DDAA" font-style="italic">Long, winding sentences that</text>
  <text x="485" y="172" fill="#88DDAA" font-style="italic">accumulate detail and sensation.</text>

  <!-- 2 -->
  <rect x="60" y="184" width="660" height="38" fill="#162030" rx="3"/>
  <text x="70" y="198" fill="#E0E8F0" font-weight="bold">Paragraph breaks</text>
  <text x="70" y="215" fill="#8AADCC" font-size="10.5">White space on page</text>
  <text x="275" y="198" fill="#FF8888" font-style="italic">Frequent breaks, white space</text>
  <text x="485" y="198" fill="#88DDAA" font-style="italic">Dense paragraphs; few breaks</text>

  <!-- 3 -->
  <rect x="60" y="226" width="660" height="38" fill="#1A2A3A" rx="3"/>
  <text x="70" y="240" fill="#E0E8F0" font-weight="bold">Dialogue</text>
  <text x="70" y="257" fill="#8AADCC" font-size="10.5">Conversation on page</text>
  <text x="275" y="240" fill="#FF8888" font-style="italic">Rapid-fire, no tags</text>
  <text x="485" y="240" fill="#88DDAA" font-style="italic">Beats, pauses, internal thought</text>

  <!-- 4 -->
  <rect x="60" y="268" width="660" height="38" fill="#162030" rx="3"/>
  <text x="70" y="282" fill="#E0E8F0" font-weight="bold">Description</text>
  <text x="70" y="299" fill="#8AADCC" font-size="10.5">Sensory / world detail</text>
  <text x="275" y="282" fill="#FF8888" font-style="italic">Minimal or absent</text>
  <text x="485" y="282" fill="#88DDAA" font-style="italic">Rich sensory immersion</text>

  <!-- 5 -->
  <rect x="60" y="310" width="660" height="38" fill="#1A2A3A" rx="3"/>
  <text x="70" y="324" fill="#E0E8F0" font-weight="bold">Backstory / Flashback</text>
  <text x="70" y="341" fill="#8AADCC" font-size="10.5">Movement in time</text>
  <text x="275" y="324" fill="#FF8888" font-style="italic">None — all present action</text>
  <text x="485" y="324" fill="#88DDAA" font-style="italic">Stops the clock; moves to past</text>

  <!-- 6 -->
  <rect x="60" y="352" width="660" height="38" fill="#162030" rx="3"/>
  <text x="70" y="366" fill="#E0E8F0" font-weight="bold">Scene vs. Summary</text>
  <text x="70" y="383" fill="#8AADCC" font-size="10.5">Real-time vs. compressed</text>
  <text x="275" y="366" fill="#FF8888" font-style="italic">Scene (real-time, moment)</text>
  <text x="485" y="366" fill="#88DDAA" font-style="italic">Summary (compressed time)</text>

  <!-- 7 -->
  <rect x="60" y="394" width="660" height="38" fill="#1A2A3A" rx="3"/>
  <text x="70" y="408" fill="#E0E8F0" font-weight="bold">Adverbs &amp; Adjectives</text>
  <text x="70" y="425" fill="#8AADCC" font-size="10.5">Modification density</text>
  <text x="275" y="408" fill="#FF8888" font-style="italic">Stripped: precise verbs only</text>
  <text x="485" y="408" fill="#88DDAA" font-style="italic">Rich: layered description</text>

  <!-- 8 -->
  <rect x="60" y="436" width="660" height="38" fill="#162030" rx="3"/>
  <text x="70" y="450" fill="#E0E8F0" font-weight="bold">Chapter / Scene endings</text>
  <text x="70" y="467" fill="#8AADCC" font-size="10.5">Hook or landing</text>
  <text x="275" y="450" fill="#FF8888" font-style="italic">Cliffhanger — keep reading</text>
  <text x="485" y="450" fill="#88DDAA" font-style="italic">Resolution — breath, closure</text>
  </g>
</svg>
