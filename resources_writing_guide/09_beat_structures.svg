<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1A3A5C"/>
      <stop offset="100%" style="stop-color:#2E5C8A"/>
    </linearGradient>
  </defs>
  <rect width="900" height="640" fill="#0F1E2E" rx="12"/>
  <rect x="0" y="0" width="900" height="56" fill="url(#hdr)" rx="12"/>
  <rect x="0" y="44" width="900" height="12" fill="url(#hdr)"/>
  <text x="450" y="28" text-anchor="middle" fill="#FFFFFF" font-size="19" font-weight="bold" letter-spacing="1">BEAT STRUCTURE FRAMEWORKS — AT A GLANCE</text>
  <text x="450" y="48" text-anchor="middle" fill="#8AADCC" font-size="11">All six major frameworks mapped to story position · choose the one that fits your genre and working style</text>

  <!-- Timeline axis -->
  <line x1="30" y1="98" x2="870" y2="98" stroke="#1A3A5C" stroke-width="1"/>
  <text x="30" y="111" fill="#5A7A9C" font-size="9">0%</text>
  <text x="211" y="111" fill="#5A7A9C" font-size="9">25%</text>
  <text x="449" y="111" fill="#5A7A9C" font-size="9">50%</text>
  <text x="687" y="111" fill="#5A7A9C" font-size="9">75%</text>
  <text x="855" y="111" fill="#5A7A9C" font-size="9">100%</text>
  <!-- Gridlines -->
  <line x1="215" y1="98" x2="215" y2="610" stroke="#1A3A5C" stroke-width="1" stroke-dasharray="3,5"/>
  <line x1="450" y1="98" x2="450" y2="610" stroke="#1A3A5C" stroke-width="1" stroke-dasharray="3,5"/>
  <line x1="685" y1="98" x2="685" y2="610" stroke="#1A3A5C" stroke-width="1" stroke-dasharray="3,5"/>
  <text x="215" y="622" text-anchor="middle" fill="#1A3A5C" font-size="9">ACT I → II</text>
  <text x="450" y="622" text-anchor="middle" fill="#1A3A5C" font-size="9">MIDPOINT</text>
  <text x="685" y="622" text-anchor="middle" fill="#1A3A5C" font-size="9">II → III</text>

  <!-- ── ROW 1: Three-Act ── -->
  <text x="30" y="130" fill="#B8860B" font-size="11" font-weight="bold">THREE-ACT</text>
  <!-- Act I: 0–25% = x30 to x215 -->
  <rect x="30" y="135" width="185" height="26" fill="#1E6B4A" rx="4"/>
  <text x="122" y="153" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="bold">ACT I — Setup</text>
  <!-- Act II: 25–75% = x215 to x685 -->
  <rect x="218" y="135" width="464" height="26" fill="#1A3A5C" rx="4"/>
  <text x="450" y="153" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="bold">ACT II — Confrontation</text>
  <!-- Act III: 75–100% = x685 to x870 -->
  <rect x="688" y="135" width="182" height="26" fill="#B8860B" rx="4"/>
  <text x="779" y="153" text-anchor="middle" fill="#0F1E2E" font-size="10" font-weight="bold">ACT III</text>

  <!-- ── ROW 2: Save the Cat (15 beats) ── -->
  <text x="30" y="183" fill="#C0392B" font-size="11" font-weight="bold">SAVE THE CAT (15 BEATS)</text>
  <!-- Each beat as a narrow block. Total width = 840px. Beats at percentages: 1,5,10,20,22,50,75,80,99 key markers -->
  <!-- Scale: x = 30 + pct * 8.4 -->
  <!-- 1: Opening Image @ 1% = x38 -->
  <rect x="30" y="188" width="8" height="22" fill="#C0392B" rx="2"/><text x="34" y="200" text-anchor="middle" fill="#FFF" font-size="6">OI</text>
  <!-- Theme Stated @ 5% = x72 -->
  <rect x="70" y="188" width="22" height="22" fill="#E05555" rx="2"/><text x="81" y="200" text-anchor="middle" fill="#FFF" font-size="6">TS</text>
  <!-- Set-Up 1-10% -->
  <rect x="38" y="188" width="66" height="22" fill="#9B2020" rx="2" opacity="0.5"/>
  <!-- Catalyst @ 10% = x114 -->
  <rect x="112" y="188" width="20" height="22" fill="#C0392B" rx="2"/><text x="122" y="200" text-anchor="middle" fill="#FFF" font-size="6">CAT</text>
  <!-- Debate 10-20% -->
  <!-- Break into 2 @ 20% = x198 -->
  <rect x="194" y="188" width="22" height="22" fill="#E05555" rx="2"/><text x="205" y="200" text-anchor="middle" fill="#FFF" font-size="6">Bi2</text>
  <!-- B Story @ 22% -->
  <rect x="218" y="188" width="18" height="22" fill="#9B2020" rx="2"/><text x="227" y="200" text-anchor="middle" fill="#FFF" font-size="6">B</text>
  <!-- Fun & Games 22-50% -->
  <rect x="238" y="188" width="202" height="22" fill="#7A1515" rx="2"/>
  <text x="339" y="200" text-anchor="middle" fill="#FFA0A0" font-size="9">Fun &amp; Games</text>
  <!-- Midpoint @ 50% = x450 -->
  <rect x="442" y="188" width="24" height="22" fill="#C0392B" rx="2"/><text x="454" y="200" text-anchor="middle" fill="#FFF" font-size="6">MID</text>
  <!-- Bad Guys Close In 50-75% -->
  <rect x="468" y="188" width="208" height="22" fill="#9B2020" rx="2"/>
  <text x="572" y="200" text-anchor="middle" fill="#FFA0A0" font-size="9">Bad Guys Close In</text>
  <!-- All Is Lost @ 75% = x660 -->
  <rect x="670" y="188" width="24" height="22" fill="#C0392B" rx="2"/><text x="682" y="200" text-anchor="middle" fill="#FFF" font-size="6">AIL</text>
  <!-- Dark Night 75-80% -->
  <rect x="696" y="188" width="40" height="22" fill="#7A1515" rx="2"/><text x="716" y="200" text-anchor="middle" fill="#FFA0A0" font-size="7">Dark Night</text>
  <!-- Break into 3 @ 80% = x702 -->
  <!-- Finale 80-99% -->
  <rect x="738" y="188" width="110" height="22" fill="#9B2020" rx="2"/>
  <text x="793" y="200" text-anchor="middle" fill="#FFA0A0" font-size="9">Finale</text>
  <!-- Final Image @ 99% -->
  <rect x="854" y="188" width="16" height="22" fill="#C0392B" rx="2"/><text x="862" y="200" text-anchor="middle" fill="#FFF" font-size="6">FI</text>

  <!-- ── ROW 3: Hero's Journey (12 stages) ── -->
  <text x="30" y="233" fill="#8E44AD" font-size="11" font-weight="bold">HERO'S JOURNEY (12 STAGES)</text>
  <!-- 12 equal segments (840/12 = 70px each) -->
  <g font-size="7.5">
  <rect x="30" y="238" width="68" height="22" fill="#5A1580" rx="2"/><text x="64" y="254" text-anchor="middle" fill="#EEB8FF">Ordinary World</text>
  <rect x="100" y="238" width="68" height="22" fill="#6B1A9C" rx="2"/><text x="134" y="254" text-anchor="middle" fill="#EEB8FF">Call to Adventure</text>
  <rect x="170" y="238" width="68" height="22" fill="#5A1580" rx="2"/><text x="204" y="254" text-anchor="middle" fill="#EEB8FF">Refusal</text>
  <rect x="240" y="238" width="68" height="22" fill="#6B1A9C" rx="2"/><text x="274" y="254" text-anchor="middle" fill="#EEB8FF">Meeting Mentor</text>
  <rect x="310" y="238" width="68" height="22" fill="#5A1580" rx="2"/><text x="344" y="254" text-anchor="middle" fill="#EEB8FF">Threshold</text>
  <rect x="380" y="238" width="68" height="22" fill="#6B1A9C" rx="2"/><text x="414" y="254" text-anchor="middle" fill="#EEB8FF">Tests &amp; Allies</text>
  <rect x="450" y="238" width="68" height="22" fill="#5A1580" rx="2"/><text x="484" y="254" text-anchor="middle" fill="#EEB8FF">Approach Cave</text>
  <rect x="520" y="238" width="68" height="22" fill="#6B1A9C" rx="2"/><text x="554" y="254" text-anchor="middle" fill="#EEB8FF">Ordeal</text>
  <rect x="590" y="238" width="68" height="22" fill="#5A1580" rx="2"/><text x="624" y="254" text-anchor="middle" fill="#EEB8FF">Reward</text>
  <rect x="660" y="238" width="68" height="22" fill="#6B1A9C" rx="2"/><text x="694" y="254" text-anchor="middle" fill="#EEB8FF">Road Back</text>
  <rect x="730" y="238" width="68" height="22" fill="#5A1580" rx="2"/><text x="764" y="254" text-anchor="middle" fill="#EEB8FF">Resurrection</text>
  <rect x="800" y="238" width="70" height="22" fill="#6B1A9C" rx="2"/><text x="835" y="254" text-anchor="middle" fill="#EEB8FF">Return w/ Elixir</text>
  </g>

  <!-- ── ROW 4: 7-Point (Wells) ── -->
  <text x="30" y="283" fill="#1E6B4A" font-size="11" font-weight="bold">7-POINT STRUCTURE (Wells)</text>
  <!-- Hook: 0-10%, PT1: ~10-25%, Pinch1: ~25-35%, Mid: ~50%, Pinch2: ~65-75%, PT2: ~75-85%, Res: ~90-100% -->
  <rect x="30" y="288" width="82" height="22" fill="#145034" rx="2"/><text x="71" y="300" text-anchor="middle" fill="#A0FFD0" font-size="8">① Hook</text>
  <rect x="114" y="288" width="100" height="22" fill="#1E6B4A" rx="2"/><text x="164" y="300" text-anchor="middle" fill="#A0FFD0" font-size="8">② Plot Turn 1</text>
  <rect x="216" y="288" width="152" height="22" fill="#145034" rx="2"/><text x="292" y="300" text-anchor="middle" fill="#A0FFD0" font-size="8">③ Pinch 1</text>
  <rect x="370" y="288" width="160" height="22" fill="#1E6B4A" rx="2"/><text x="450" y="300" text-anchor="middle" fill="#A0FFD0" font-size="8">④ MIDPOINT</text>
  <rect x="532" y="288" width="126" height="22" fill="#145034" rx="2"/><text x="595" y="300" text-anchor="middle" fill="#A0FFD0" font-size="8">⑤ Pinch 2</text>
  <rect x="660" y="288" width="100" height="22" fill="#1E6B4A" rx="2"/><text x="710" y="300" text-anchor="middle" fill="#A0FFD0" font-size="8">⑥ Plot Turn 2</text>
  <rect x="762" y="288" width="108" height="22" fill="#145034" rx="2"/><text x="816" y="300" text-anchor="middle" fill="#A0FFD0" font-size="8">⑦ Resolution</text>

  <!-- ── ROW 5: 8-Point Arc (Watts) ── -->
  <text x="30" y="333" fill="#2E5C8A" font-size="11" font-weight="bold">8-POINT ARC (Watts)</text>
  <!-- 8 roughly equal segments -->
  <g font-size="7.5">
  <rect x="30" y="338" width="100" height="22" fill="#0d2240" rx="2"/><text x="80" y="350" text-anchor="middle" fill="#80C4FF">① Stasis</text>
  <rect x="132" y="338" width="100" height="22" fill="#1A3A5C" rx="2"/><text x="182" y="350" text-anchor="middle" fill="#80C4FF">② Trigger</text>
  <rect x="234" y="338" width="200" height="22" fill="#0d2240" rx="2"/><text x="334" y="350" text-anchor="middle" fill="#80C4FF">③ Quest (evolves)</text>
  <rect x="436" y="338" width="118" height="22" fill="#1A3A5C" rx="2"/><text x="495" y="350" text-anchor="middle" fill="#80C4FF">④ Surprise</text>
  <rect x="556" y="338" width="120" height="22" fill="#0d2240" rx="2"/><text x="616" y="350" text-anchor="middle" fill="#80C4FF">⑤ Critical Choice</text>
  <rect x="678" y="338" width="74" height="22" fill="#1A3A5C" rx="2"/><text x="715" y="350" text-anchor="middle" fill="#80C4FF">⑥ Climax</text>
  <rect x="754" y="338" width="58" height="22" fill="#0d2240" rx="2"/><text x="783" y="350" text-anchor="middle" fill="#80C4FF">⑦ Rev.</text>
  <rect x="814" y="338" width="56" height="22" fill="#1A3A5C" rx="2"/><text x="842" y="350" text-anchor="middle" fill="#80C4FF">⑧ Res.</text>
  </g>

  <!-- ── ROW 6: Freytag's Pyramid ── -->
  <text x="30" y="383" fill="#5A7A9C" font-size="11" font-weight="bold">FREYTAG'S PYRAMID</text>
  <rect x="30" y="388" width="120" height="22" fill="#1A2A3A" rx="2"/><text x="90" y="400" text-anchor="middle" fill="#9ABCDD" font-size="8">① Exposition</text>
  <rect x="152" y="388" width="296" height="22" fill="#1A3A5C" rx="2"/><text x="300" y="400" text-anchor="middle" fill="#9ABCDD" font-size="8">② Rising Action</text>
  <rect x="450" y="388" width="56" height="22" fill="#2E5C8A" rx="2"/><text x="478" y="400" text-anchor="middle" fill="#FFF" font-size="8">③ Climax</text>
  <rect x="508" y="388" width="200" height="22" fill="#1A3A5C" rx="2"/><text x="608" y="400" text-anchor="middle" fill="#9ABCDD" font-size="8">④ Falling Action</text>
  <rect x="710" y="388" width="160" height="22" fill="#1A2A3A" rx="2"/><text x="790" y="400" text-anchor="middle" fill="#9ABCDD" font-size="8">⑤ Denouement</text>

  <!-- ── COMPARISON TABLE ── -->
  <rect x="30" y="425" width="840" height="190" fill="#0d1a2a" rx="8" stroke="#1A3A5C" stroke-width="1"/>
  <text x="450" y="444" text-anchor="middle" fill="#B8860B" font-size="12" font-weight="bold">QUICK COMPARISON</text>

  <!-- Headers -->
  <g font-size="10" font-weight="bold">
  <text x="45" y="462" fill="#8AADCC">FRAMEWORK</text>
  <text x="215" y="462" fill="#8AADCC">BEATS</text>
  <text x="270" y="462" fill="#8AADCC">COMPLEXITY</text>
  <text x="370" y="462" fill="#8AADCC">BEST GENRE</text>
  <text x="530" y="462" fill="#8AADCC">KEY STRENGTH</text>
  <text x="720" y="462" fill="#8AADCC">KEY WEAKNESS</text>
  </g>
  <line x1="40" y1="466" x2="860" y2="466" stroke="#1A3A5C" stroke-width="1"/>

  <g font-size="9.5">
  <!-- Three-Act -->
  <text x="45" y="480" fill="#B8860B" font-weight="bold">Three-Act</text>
  <text x="215" y="480" fill="#D0E0F0">3</text>
  <text x="270" y="480" fill="#80E0A8">Low</text>
  <text x="370" y="480" fill="#D0E0F0">Universal</text>
  <text x="530" y="480" fill="#D0E0F0">Works with everything</text>
  <text x="720" y="480" fill="#D0E0F0">Too broad alone</text>

  <!-- STC -->
  <text x="45" y="496" fill="#C0392B" font-weight="bold">Save the Cat</text>
  <text x="215" y="496" fill="#D0E0F0">15</text>
  <text x="270" y="496" fill="#FF8080">High</text>
  <text x="370" y="496" fill="#D0E0F0">Genre fiction</text>
  <text x="530" y="496" fill="#D0E0F0">Precise pacing targets</text>
  <text x="720" y="496" fill="#D0E0F0">Can feel formulaic</text>

  <!-- Hero's Journey -->
  <text x="45" y="512" fill="#8E44AD" font-weight="bold">Hero's Journey</text>
  <text x="215" y="512" fill="#D0E0F0">12</text>
  <text x="270" y="512" fill="#FFDD80">Medium</text>
  <text x="370" y="512" fill="#D0E0F0">Fantasy / Adventure</text>
  <text x="530" y="512" fill="#D0E0F0">Archetypal depth</text>
  <text x="720" y="512" fill="#D0E0F0">Return stage awkward</text>

  <!-- 7-Point -->
  <text x="45" y="528" fill="#1E6B4A" font-weight="bold">7-Point (Wells)</text>
  <text x="215" y="528" fill="#D0E0F0">7</text>
  <text x="270" y="528" fill="#80E0A8">Low–Med</text>
  <text x="370" y="528" fill="#D0E0F0">Character-arc driven</text>
  <text x="530" y="528" fill="#D0E0F0">Symmetry; great on subplots</text>
  <text x="720" y="528" fill="#D0E0F0">Too skeletal without scenes</text>

  <!-- 8-Point -->
  <text x="45" y="544" fill="#2E5C8A" font-weight="bold">8-Point (Watts)</text>
  <text x="215" y="544" fill="#D0E0F0">8</text>
  <text x="270" y="544" fill="#80E0A8">Low</text>
  <text x="370" y="544" fill="#D0E0F0">Literary / short fiction</text>
  <text x="530" y="544" fill="#D0E0F0">Quest evolution concept</text>
  <text x="720" y="544" fill="#D0E0F0">Less prescriptive</text>

  <!-- Snowflake -->
  <text x="45" y="560" fill="#5A7A9C" font-weight="bold">Snowflake</text>
  <text x="215" y="560" fill="#D0E0F0">10 steps</text>
  <text x="270" y="560" fill="#FF8080">High</text>
  <text x="370" y="560" fill="#D0E0F0">Complex fantasy / sci-fi</text>
  <text x="530" y="560" fill="#D0E0F0">Manages scope &amp; complexity</text>
  <text x="720" y="560" fill="#D0E0F0">Time-intensive; can stall</text>

  <!-- Freytag -->
  <text x="45" y="576" fill="#5A7A9C" font-weight="bold">Freytag</text>
  <text x="215" y="576" fill="#D0E0F0">5</text>
  <text x="270" y="576" fill="#80E0A8">Low</text>
  <text x="370" y="576" fill="#D0E0F0">Tragedy / drama</text>
  <text x="530" y="576" fill="#D0E0F0">Classical foundation</text>
  <text x="720" y="576" fill="#D0E0F0">Modern pacing mismatch</text>
  </g>

  <text x="450" y="622" text-anchor="middle" fill="#5A7A9C" font-size="10" font-style="italic">All frameworks describe the same underlying shape. Choose by genre, complexity tolerance, and working style — not by prestige.</text>
</svg>
