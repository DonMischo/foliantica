services:

  # ── PostgreSQL database (optional — alternative to the embedded PG) ───────────
  # Enable in Settings → External Services → PostgreSQL Database.
  # Runs on port 5434 (not 5433) so it can coexist with the embedded PG cluster.
  # Data persists in the named volume below; survives app reinstalls.
  postgres:
    image: postgres:17-alpine
    container_name: foliantica-postgres
    restart: unless-stopped
    profiles:
      - postgres          # only started when explicitly requested
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_USER:     foliantica
      POSTGRES_PASSWORD: foliantica
      POSTGRES_DB:       foliantica
    volumes:
      - foliantica-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foliantica"]
      interval: 5s
      timeout: 5s
      retries: 10

  languagetool:
    # Multi-arch base (amd64 + arm64) — runs natively on Windows on ARM and
    # Apple Silicon, no QEMU emulation or binfmt registration needed anymore.
    # Local build adds libhunspell, which the arm64 variant lacks (German
    # spellcheck fails without it) — see docker/languagetool/Dockerfile.
    build: ./docker/languagetool
    image: foliantica-languagetool
    container_name: foliantica-languagetool
    restart: unless-stopped
    profiles:
      - languagetool
    read_only: true
    tmpfs:
      - /tmp:exec
    cap_drop:
      - ALL
    cap_add:
      - CAP_CHOWN
      - CAP_DAC_OVERRIDE
      - CAP_SETUID
      - CAP_SETGID
    security_opt:
      - no-new-privileges
    ports:
      # Bind to localhost only — LanguageTool is a local service, no need to
      # expose it to other devices on the network.
      - "127.0.0.1:8081:8081"
    environment:
      # N-gram models improve confused-word and style detection (~2–3 GB per
      # language, downloaded once on first start — container will be slow to
      # respond until the download finishes).
      download_ngrams_for_langs: ${LT_LANGS:-en}

      # Restrict API access to localhost and the Docker bridge subnet.
      # Suppresses the "running in public mode" startup warning and prevents
      # access from other network devices.
      # 127.0.0.1       — host loopback (direct connections)
      # 172.16.0.0/12   — Docker bridge networks (172.17–172.31.x.x)
      langtool_allowedIps: 127.0.0.1;172.16.0.0/12

      # Java heap size — tune to your system
      JAVA_XMS: 512m
      JAVA_XMX: 2g
    volumes:
      # Named volumes — stored in Docker's own volume store, completely outside
      # the app installation directory. Survive reinstalls and app updates.
      - foliantica-lt-ngrams:/ngrams
      - foliantica-lt-fasttext:/fasttext

  pandoc:
    build:
      context: ./docker/pandoc
    container_name: foliantica-pandoc
    restart: unless-stopped
    profiles:
      - pandoc
    ports:
      - "8082:8082"

  spacy:
    build:
      context: ./docker/spacy
    container_name: foliantica-spacy
    restart: unless-stopped
    profiles:
      - spacy
    ports:
      - "127.0.0.1:8083:8083"

  calibre:
    build:
      context: ./docker/calibre
    container_name: foliantica-calibre
    restart: unless-stopped
    profiles:
      - calibre
    ports:
      - "127.0.0.1:8084:8084"

  vale:
    build:
      context: ./docker/vale
    container_name: foliantica-vale
    restart: unless-stopped
    profiles:
      - vale
    ports:
      - "127.0.0.1:8085:8085"

# ── Named volumes ─────────────────────────────────────────────────────────────
# Stored in Docker's volume store (outside the app installation directory).
# Persist across Foliantica reinstalls, updates, and OS reboots.
# To reclaim disk space: docker volume rm foliantica-lt-ngrams foliantica-lt-fasttext
volumes:
  foliantica-lt-ngrams:
  foliantica-lt-fasttext:
  foliantica-pg-data:
