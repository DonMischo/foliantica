<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 576" font-family="Arial, sans-serif">
  <rect width="780" height="576" fill="#0F1E2E" rx="12"/>
  <text x="390" y="36" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="bold" letter-spacing="1">THE SELF-EDIT CHECKLIST</text>
  <line x1="40" y1="48" x2="740" y2="48" stroke="#B8860B" stroke-width="2"/>
  <text x="390" y="64" text-anchor="middle" fill="#8AADCC" font-size="11">Work through these in order: Story → Scene → Line. Never reverse.</text>

  <!-- STORY LEVEL -->
  <rect x="30" y="76" width="226" height="200" fill="#1A2A3A" rx="8" stroke="#1E6B4A" stroke-width="2"/>
  <rect x="30" y="76" width="226" height="32" fill="#1E6B4A" rx="8"/>
  <rect x="30" y="94" width="226" height="14" fill="#1E6B4A"/>
  <text x="143" y="98" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="bold">① STORY LEVEL</text>
  <g fill="#D0E8D8" font-size="11">
    <text x="44" y="122">☐ Every scene advances plot OR</text>
    <text x="54" y="137">  reveals character</text>
    <text x="44" y="154">☐ Protagonist makes the key</text>
    <text x="54" y="169">  decision at the climax</text>
    <text x="44" y="186">☐ Character changes (or</text>
    <text x="54" y="201">  knowingly refuses to)</text>
    <text x="44" y="218">☐ Inciting incident by p. 15–20</text>
    <text x="44" y="237">☐ Every subplot links to theme</text>
    <text x="44" y="256">☐ No deus ex machina</text>
  </g>

  <!-- SCENE LEVEL -->
  <rect x="276" y="76" width="226" height="200" fill="#1A2A3A" rx="8" stroke="#B8860B" stroke-width="2"/>
  <rect x="276" y="76" width="226" height="32" fill="#B8860B" rx="8"/>
  <rect x="276" y="94" width="226" height="14" fill="#B8860B"/>
  <text x="389" y="98" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="bold">② SCENE LEVEL</text>
  <g fill="#F0E8CC" font-size="11">
    <text x="290" y="122">☐ Each scene ends differently</text>
    <text x="300" y="137">  than it began</text>
    <text x="290" y="154">☐ POV consistent within scene</text>
    <text x="290" y="171">☐ Scene goal creates tension</text>
    <text x="290" y="188">☐ Backstory placed where</text>
    <text x="300" y="203">  reader is most desperate for it</text>
    <text x="290" y="220">☐ No head-hopping</text>
    <text x="290" y="237">☐ Dialogue does double duty</text>
    <text x="290" y="256">☐ No info-dump blocks</text>
  </g>

  <!-- LINE LEVEL -->
  <rect x="522" y="76" width="226" height="200" fill="#1A2A3A" rx="8" stroke="#8E44AD" stroke-width="2"/>
  <rect x="522" y="76" width="226" height="32" fill="#8E44AD" rx="8"/>
  <rect x="522" y="94" width="226" height="14" fill="#8E44AD"/>
  <text x="635" y="98" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="bold">③ LINE LEVEL</text>
  <g fill="#E8D0FF" font-size="11">
    <text x="536" y="122">☐ Search: felt/saw/noticed/heard</text>
    <text x="546" y="137">  (filter words — try removing)</text>
    <text x="536" y="154">☐ Search: very/really/quite/</text>
    <text x="546" y="169">  suddenly (usually unnecessary)</text>
    <text x="536" y="186">☐ Search: was/were + -ing</text>
    <text x="546" y="201">  (passive in disguise)</text>
    <text x="536" y="218">☐ Non-'said' tags — justified?</text>
    <text x="536" y="235">☐ First + last line each chapter</text>
    <text x="536" y="254">☐ Clichés replaced?</text>
  </g>

  <!-- Search Terms Box -->
  <rect x="30" y="290" width="718" height="100" fill="#1A2A3A" rx="8" stroke="#1A3A5C" stroke-width="1.5"/>
  <text x="389" y="310" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="bold">🔍  FIND-AND-REPLACE TARGETS — search these in any manuscript</text>
  <g font-size="11">
  <rect x="44" y="318" width="155" height="60" fill="#2A1A00" rx="4"/>
  <text x="121" y="334" text-anchor="middle" fill="#FFCC40" font-weight="bold">FILTER WORDS</text>
  <text x="121" y="350" text-anchor="middle" fill="#FFE88A" font-size="10">felt · saw · noticed</text>
  <text x="121" y="366" text-anchor="middle" fill="#FFE88A" font-size="10">heard · thought · realized</text>

  <rect x="208" y="318" width="155" height="60" fill="#001A2A" rx="4"/>
  <text x="285" y="334" text-anchor="middle" fill="#80AAFF" font-weight="bold">WEAK QUALIFIERS</text>
  <text x="285" y="350" text-anchor="middle" fill="#AACCFF" font-size="10">very · really · quite</text>
  <text x="285" y="366" text-anchor="middle" fill="#AACCFF" font-size="10">rather · somewhat · just</text>

  <rect x="372" y="318" width="155" height="60" fill="#1A001A" rx="4"/>
  <text x="449" y="334" text-anchor="middle" fill="#CC80FF" font-weight="bold">PASSIVE SIGNALS</text>
  <text x="449" y="350" text-anchor="middle" fill="#DDAAFF" font-size="10">was [verb]ed · were [verb]ed</text>
  <text x="449" y="366" text-anchor="middle" fill="#DDAAFF" font-size="10">had been · there was/were</text>

  <rect x="536" y="318" width="200" height="60" fill="#001A00" rx="4"/>
  <text x="636" y="334" text-anchor="middle" fill="#80FF80" font-weight="bold">SUDDEN ONSET</text>
  <text x="636" y="350" text-anchor="middle" fill="#AAFFAA" font-size="10">suddenly · all at once</text>
  <text x="636" y="366" text-anchor="middle" fill="#AAFFAA" font-size="10">without warning · instantly</text>
  </g>

  <!-- Final rule -->
  <rect x="30" y="404" width="718" height="56" fill="#1A2A3A" rx="8" stroke="#B8860B" stroke-width="1.5"/>
  <text x="389" y="426" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="bold">💡  THE GOLDEN RULE OF SELF-EDITING</text>
  <text x="389" y="448" text-anchor="middle" fill="#D0C090" font-size="11">Put the manuscript away for at least two weeks before your final pass.</text>
  <text x="389" y="464" text-anchor="middle" fill="#D0C090" font-size="11">The distance is not optional. It is the craft. — Mary Simses / James N. Frey</text>

  <!-- Multilingual note -->
  <rect x="30" y="472" width="718" height="88" fill="#0D1E2E" rx="8" stroke="#1A3A5C" stroke-width="1"/>
  <text x="389" y="492" text-anchor="middle" fill="#5A7A9C" font-size="12" font-weight="bold">LANGUAGE-SPECIFIC ADD-ONS</text>
  <text x="50" y="510" fill="#5A7A9C" font-size="10">🇫🇷 FR: Search passé composé in literary fiction — replace with passé simple</text>
  <text x="50" y="526" fill="#5A7A9C" font-size="10">🇩🇪 DE: Search Substantivierungen (Öffnung der Tür → er öffnete die Tür)  ·  🇪🇸 ES: Search -mente adverbs  ·  🇳🇱 NL: Search tense flips</text>
  <text x="50" y="542" fill="#5A7A9C" font-size="10">🇧🇷 PT-BR: Search travessão punctuation + gerúndio overuse  ·  🇸🇪 SV: Search tempusskiften (tense shifts)  ·  🇵🇱 PL: Check dialogue dash formatting</text>
</svg>
